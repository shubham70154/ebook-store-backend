server:
port: 8080

spring:
application:
name: ebook-store-backend

# H2 Database Configuration
datasource:
url: jdbc:h2:mem:ebookstoredb;DB_CLOSE_ON_EXIT=FALSE
driver-class-name: org.h2.Driver
username: sa
password:

# H2 Console
h2:
console:
enabled: true
path: /h2-console

# JPA Configuration
jpa:
hibernate:
ddl-auto: update
show-sql: true
open-in-view: false
properties:
format_sql: true

# Application Logging
logging:
level:
root: INFO
com.ebookstore: DEBUG
org.hibernate.SQL: DEBUG
